# Render Blueprint for the Larpdin backend. https://render.com/docs/blueprint-spec
# Rate limits are in-memory, so this service must run as exactly one instance.
services:
  - type: web
    name: larpdin-backend
    runtime: node
    plan: free # upgrade to "starter" to avoid cold starts (free instances sleep after ~15 min idle)
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Gemini is the only enabled provider.
      - key: LLM_PROVIDERS
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: REQUIRE_DEMO_TOKEN
        value: "false"
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard; never committed
